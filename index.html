<style>

nslateY(-100%);opacity:0;pointer-events:none}.date{font-size:15px;color:#e8edf5}.time{font-size:76px;letter-spacing:-4px;font-weight:300;line-height:1.15;margin-top:5px}.locknote{margin-top:28px;width:100%;border:1px solid #ffffff22;background:#ffffff12;backdrop-filter:blur(16px);padding:16px;border-radius:20px;font-size:13px;color:#f4f7fb}.locknote strong{display:block;margin-bottom:5px;font-size:15px}.unlock{margin-top:auto;text-align:center;font-size:13px;color:#ffffffdd;cursor:pointer}.fingerprint{margin:0 auto 10px;width:48px;height:48px;border:1px solid #ffffff55;border-radius:50%;display:grid;place-items:center;font-size:22px}.home{position:absolute;z-index:1;inset:60px 17px 28px;display:flex;flex-direction:column;opacity:0;transform:translateY(16px);transition:.4s}.home.visible{opacity:1;transform:none}.widget{padding:12px 14px;border:1px solid #ffffff1e;border-radius:22px;background:#eaf1ff1b;backdrop-filter:blur(15px);box-shadow:0 8px 24px #0002;margin-bottom:21px}.widgetrow{display:flex;justify-content:space-between;gap:8px;align-items:center}.widgetday{font-size:12px;color:#d2dbea}.widgettime{font-size:20px;font-weight:650;margin-top:5px}.eventpeek{font-size:12px;color:#e3e9f2;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:19px 8px;align-content:start}.app{border:0;background:none;color:white;font:inherit;display:flex;align-items:center;flex-direction:column;gap:6px;cursor:pointer;min-width:0}.icon{width:55px;height:55px;border-radius:15px;display:grid;place-items:center;font-size:25px;box-shadow:0 4px 14px #0002;position:relative}.app span:last-child{font-size:11px;text-shadow:0 1px 4px #0008}.badge{position:absolute;top:-5px;right:-4px;min-width:18px;height:18px;border-radius:99px;background:#ee5967;border:2px solid #263348;font-size:10px;display:grid;place-items:center;padding:0 4px}.dock{margin-top:auto;background:#ffffff20;border:1px solid #ffffff20;border-radius:19px;padding:9px 8px;display:grid;grid-template-columns:repeat(4,1fr)}.dock .icon{width:48px;height:48px}.navpill{position:absolute;z-index:4;bottom:6px;left:50%;transform:translateX(-50%);width:136px;height:5px;border:0;border-radius:99px;background:#fff;cursor:pointer}.phone:focus-within{outline:0}.appview{position:absolute;z-index:5;inset:0;background:#f5f6fa;color:#18202c;transform:translateY(105%);transition:transform .32s;border-radius:0;display:flex;flex-direction:column}.appview.open{transform:translateY(0)}.apphead{padding:39px 17px 13px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #e7eaf0;background:#f8f9fc}.back{border:0;background:#e8edf5;color:#28364c;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}.apptitle{font-size:18px;font-weight:700;flex:1}.appbody{padding:16px;overflow:auto;flex:1}.card{background:white;border:1px solid #e9edf3;border-radius:18px;padding:15px;margin-bottom:11px;box-shadow:0 4px 14px #18243a08}.muted{color:#687488;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.msg{padding:13px 0;border-bottom:1px solid #edf0f4}.msg:last-child{border:0}.msg b,.note b{display:block;margin-bottom:4px}.pill{display:inline-block;border-radius:99px;background:#edf3ff;color:#3565aa;padding:4px 9px;font-size:11px}.searchbox{width:100%;border:1px solid #dce2ea;border-radius:14px;padding:13px;font:inherit;margin-bottom:12px}.editor{position:fixed;inset:0;z-index:20;background:#070b12b8;display:none;align-items:center;justify-content:center;padding:15px}.editor.open{display:flex}.panel{width:min(100%,680px);max-height:90dvh;overflow:auto;background:#f5f7fb;color:#172033;border-radius:24px;padding:20px;box-shadow:0 24px 90px #0006}.paneltop{display:flex;align-items:center;gap:10px;justify-content:space-between}.panel h2{margin:0;font-size:21px}.x{border:0;background:#e4e9f1;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer}.tabs{display:flex;gap:7px;overflow-x:auto;padding:14px 0}.tab{white-space:nowrap;border:0;border-radius:99px;background:#e7ebf2;color:#33415b;padding:8px 12px;cursor:pointer}.tab.active{background:#cfe0ff;color:#17447f}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#58647a;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #d7dde7;border-radius:11px;padding:11px;background:white;color:#18202c;font:inherit}.field textarea{min-height:82px;resize:vertical}.action{border:0;border-radius:11px;padding:10px 13px;background:#245fba;color:white;font:inherit;font-weight:650;cursor:pointer}.action.secondary{background:#e5eaf2;color:#33415b}.action.danger{background:#ffebed;color:#a42b3a}.itemedit{background:white;border:1px solid #e2e7ef;border-radius:13px;margin:8px 0;padding:11px}.itemedit header{display:flex;justify-content:space-between;gap:8px;align-items:center}.hint{font-size:12px;color:#66748a;line-height:1.55}.toast{position:absolute;z-index:12;left:50%;bottom:45px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#101722eF;color:white;border-radius:99px;padding:9px 15px;font-size:12px;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.under{color:#d4dbea;font-size:12px;text-align:center}.calendar-day{display:inline-flex;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;background:#eaf1ff;color:#2859a2;margin:2px;font-size:13px}.album{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.photo{min-height:115px;border-radius:16px;background:linear-gradient(140deg,#dce9ff,#dceeea);display:grid;place-items:center;font-size:34px;overflow:hidden}.photo img{width:100%;height:125px;object-fit:cover}.note-body{white-space:pre-wrap;line-height:1.55}.dial{font-size:27px;text-align:center;margin:20px}.keys{display:grid;grid-template-columns:repeat(3,60px);gap:10px;justify-content:center}.keys button{height:55px;border:0;border-radius:50%;background:white;font-size:18px;cursor:pointer}.chatline{max-width:84%;padding:11px 14px;border-radius:18px;margin:9px 0;background:#e8edf5;line-height:1.45}.chatline.mine{margin-left:auto;background:#cfe1ff;border-bottom-right-radius:5px}.chatcomposer{display:flex;gap:7px;position:sticky;bottom:0;background:#f5f6fa;padding:10px 0}.chatcomposer input{min-width:0;flex:1;border:1px solid #dce2ea;border-radius:99px;padding:12px;font:inherit}.call-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:0;border-radius:50%;width:58px;height:58px;background:#35a96e;color:white;font-size:24px;cursor:pointer}

<body><div class="stage"><div class="topline"><span>● &nbsp;피터3의 Galaxy · One UI</span><button onclick="openEditor()">⚙ 편집</button></div><div class="phone" id="phone"><div class="screen"><div class="status"><span id="status-time">오후 11:59</span><span>▮▮▮　Wi-Fi　▰</span></div><section class="lock" id="lock" onclick="unlock()"><div class="date" id="lock-date">10월 18일 일요일</div><div class="time" id="lock-time">11:59</div><div class="locknote"><strong>피터3의 휴대폰</strong><span id="lock-preview">새로운 하루가 시작됐어요.</span></div><div class="unlock"><div class="fingerprint">⌁</div>화면을 눌러 잠금 해제</div></section><section class="home" id="home"><div class="widget"><div class="widgetrow"><div><div class="widgetday" id="home-date">일요일 · 10월 18일</div><div class="widgettime" id="home-clock">11:59</div></div><div style="font-size:26px">☁️ <small style="font-size:12px">18°</small></div></div><div class="eventpeek" id="event-peek">오늘 일정이 여기에 표시돼요</div></div><div class="apps" id="apps"></div><div class="dock" id="dock"></div></section><div class="appview" id="appview"><header class="apphead"><button class="back" onclick="closeApp()">‹</button><div class="apptitle" id="apptitle">앱</div><button class="plain" style="color:#52647f" onclick="openEditor()">편집</button></header><div class="appbody" id="appbody"></div></div><button class="navpill" aria-label="홈으로" onclick="closeApp()"></button><div class="toast" id="toast"></div></div><div class="under">Galaxy · One UI 스타일 &nbsp;|&nbsp; 피터3의 휴대폰</div></div>
<div class="editor" id="editor" onclick="if(event.target===this)closeEditor()"><div class="panel"><div class="paneltop"><h2>휴대폰 내용 편집</h2><button class="x" onclick="closeEditor()">×</button></div><p class="hint">여기서 추가하거나 수정한 내용은 이 브라우저에 저장돼요. 파일을 다른 기기로 옮겨도 내용까지 따라가지는 않으니, 아래 백업 기능을 이용해 보관할 수 있어요.</p><div class="tabs" id="tabs"></div><div id="editorcontent"></div><hr style="border:0;border-top:1px solid #dfe4ec;margin:18px 0"><div class="row"><button class="action secondary" onclick="exportData()">백업 파일 저장</button><label class="action secondary" style="cursor:pointer">백업 불러오기<input type="file" accept="application/json,.json" hidden onchange="importData(event)"></label><button class="action danger" onclick="resetData()">초기화</button></div></div></div>
<script>
const KEY='peter3-galaxy-data-v1';
const initial={messages:[{name:'민재',time:'오후 4:32',text:'오늘 늦을 것 같아. 먼저 들어가 있어!'},{name:'엄마',time:'오전 9:10',text:'밥은 꼭 챙겨 먹기 :)'}],notes:[{title:'기억할 것',text:'열쇠 챙기기\n민재한테 연락하기',date:'오늘'}],emails:[{from:'대성물산',subject:'미팅 일정 안내',text:'내일 오전 10시, 3층 회의실에서 뵙겠습니다.',time:'오전 10:24'}],events:[{title:'의뢰인 미팅',date:'2026-10-19',time:'10:00',place:'사무실 3층 회의실'}],photos:[{title:'저녁 하늘',caption:'집에 가는 길에 찍은 사진',emoji:'🌆'},{title:'커피',caption:'오늘의 커피',emoji:'☕'}],alarms:[{time:'07:30',label:'일어나기'}],contacts:[{name:'민재',number:'010-1234-5678'},{name:'엄마',number:'010-0000-0000'}],weather:{city:'서울',temp:'18°',sky:'구름 조금'}};
let data=load();let currentApp='';let editorTab='messages';
const allApps=[['messages','메시지','💬','#5b8dec'],['calendar','캘린더','📅','#f6f7fb'],['clock','시계','🕰️','#4c617b'],['weather','날씨','🌤️','#8cc9f2'],['notes','메모','📝','#f4d56c'],['gallery','갤러리','🌄','#cc8ee9'],['camera','카메라','📷','#596678'],['email','메일','✉️','#76a4f7'],['browser','Chrome','🌐','#eac27c'],['phone','전화','📞','#63c798'],['contacts','연락처','👤','#e68a9b']];
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x?{...structuredClone(initial),...x}:structuredClone(initial)}catch{return structuredClone(initial)}}function save(){localStorage.setItem(KEY,JSON.stringify(data));renderHome();if(currentApp)showApp(currentApp);toast('저장했어요')}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
function renderHome(){const apps=document.getElementById('apps'),dock=document.getElementById('dock');apps.innerHTML='';dock.innerHTML='';allApps.forEach((a,i)=>{let b=document.createElement('button');b.className='app';b.innerHTML=`<span class="icon" style="background:${a[3]}">${a[2]}${a[0]==='messages'&&data.messages.length?'<i class="badge">'+data.messages.length+'</i>':''}</span><span>${a[1]}</span>`;b.onclick=()=>openApp(a[0]);(i>=8?dock:apps).appendChild(b)});let now=new Date();let days=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];let tm=now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('home-clock').textContent=tm;document.getElementById('lock-time').textContent=tm;document.getElementById('status-time').textContent=now.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit',hour12:true});document.getElementById('home-date').textContent=`${days[now.getDay()]} · ${now.getMonth()+1}월 ${now.getDate()}일`;document.getElementById('lock-date').textContent=`${now.getMonth()+1}월 ${now.getDate()}일 ${days[now.getDay()]}`;let ev=data.events?.[0];document.getElementById('event-peek').textContent=ev?`${ev.date} ${ev.time} · ${ev.title}${ev.place?' — '+ev.place:''}`:'일정이 없어요 · 편집에서 추가하기';document.getElementById('lock-preview').textContent=data.messages?.[0]?`${data.messages[0].name}: ${data.messages[0].text}`:'새로운 하루가 시작됐어요.'}
function unlock(){document.getElementById('lock').classList.add('hidden');document.getElementById('home').classList.add('visible')}function openApp(id){currentApp=id;document.getElementById('appview').classList.add('open');showApp(id)}function closeApp(){document.getElementById('appview').classList.remove('open');currentApp='';window.activeThread=null}
const names={messages:'메시지',calendar:'캘린더',clock:'시계',weather:'날씨',notes:'메모',gallery:'갤러리',camera:'카메라',email:'메일',browser:'Chrome',phone:'전화',contacts:'연락처'};
function showApp(id){document.getElementById('apptitle').textContent=names[id]||'앱';let el=document.getElementById('appbody'),html='';if(id==='messages'){if(window.activeThread){const person=window.activeThread;const replies=(data.replies||{})[person]||[];html=`<div class="hint">${esc(person)}와의 대화</div><div>${(data.messages||[]).filter(m=>m.name===person).map(m=>`<div class="chatline">${esc(m.text)}<small class="muted" style="display:block;margin-top:4px">${esc(m.time||'')}</small></div>`).join('')}${replies.map(m=>`<div class="chatline mine">${esc(m.text)}<small class="muted" style="display:block;margin-top:4px">${esc(m.time)}</small></div>`).join('')}</div><div class="chatcomposer"><input id="reply-input" placeholder="메시지 입력" onkeydown="if(event.key==='Enter')sendReply()"><button class="action" onclick="sendReply()">보내기</button></div><p class="hint">대화 답장은 이 휴대폰 화면 안에 저장되는 시뮬레이션이에요.</p>`}else{html=`<button class="action" onclick="openEditor('messages')">＋ 새 대화 추가</button>`+(data.messages||[]).map(m=>`<button class="msg" style="width:100%;text-align:left;background:none;border:0;color:inherit;cursor:pointer" onclick="window.activeThread=${JSON.stringify(m.name)};showApp('messages')"><div class="row"><b>${esc(m.name)}</b><small class="muted">${esc(m.time)}</small></div><div>${esc(m.text)}</div></button>`).join('')||'<p class="muted">아직 메시지가 없어요.</p>'}}
else if(id==='calendar'){let d=new Date();html=`<div class="card"><div class="muted">${d.getFullYear()}년 ${d.getMonth()+1}월</div><div style="margin:12px 0">${['일','월','화','수','목','금','토'].map(x=>`<span class="calendar-day" style="background:transparent;color:#8490a0">${x}</span>`).join('')}</div><div>${Array.from({length:31},(_,i)=>`<span class="calendar-day">${i+1}</span>`).join('')}</div></div><button class="action" onclick="openEditor('events')">＋ 일정 추가</button>`+(data.events||[]).map(e=>`<div class="card"><span class="pill">${esc(e.date)} · ${esc(e.time)}</span><h3 style="margin:9px 0 4px">${esc(e.title)}</h3><span class="muted">${esc(e.place)}</span></div>`).join('')}
else if(id==='clock'){html=`<div class="card" style="text-align:center"><div class="muted">현재 시간</div><div style="font-size:48px;font-weight:300;margin:12px">${new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}</div></div><div class="row"><h3>알람</h3><button class="action secondary" onclick="openEditor('alarms')">＋ 추가</button></div>`+(data.alarms||[]).map(a=>`<div class="card row"><strong style="font-size:28px">${esc(a.time)}</strong><span class="muted">${esc(a.label)}</span><span>◉</span></div>`).join('')}
else if(id==='weather'){let w=data.weather||initial.weather;html=`<div class="card" style="text-align:center;background:linear-gradient(145deg,#d8edff,#f4f9ff)"><div class="muted">${esc(w.city)} · 지금</div><div style="font-size:68px;margin:9px">${esc(w.sky||'🌤️')}</div><div style="font-size:45px;font-weight:300">${esc(w.temp)}</div><div class="muted">${esc(w.condition||'현재 날씨')}</div></div><button class="action secondary" onclick="openEditor('weather')">날씨 정보 편집</button>`}
else if(id==='notes'){html=`<button class="action" onclick="openEditor('notes')">＋ 새 메모</button>`+(data.notes||[]).map(n=>`<div class="card note"><b>${esc(n.title)}</b><div class="note-body">${esc(n.text)}</div><div class="muted" style="margin-top:8px">${esc(n.date)}</div></div>`).join('')||'<p class="muted">메모가 없어요.</p>'}
else if(id==='gallery'){html=`<button class="action secondary" onclick="openEditor('photos')">사진 설명 추가</button><div class="album" style="margin-top:12px">`+(data.photos||[]).map(p=>`<div class="card" style="padding:8px"><div class="photo">${p.image?`<img src="${p.image}" alt="${esc(p.title)}">`:esc(p.emoji||'🖼️')}</div><b style="display:block;margin:8px 3px 3px">${esc(p.title)}</b><small class="muted">${esc(p.caption)}</small></div>`).join('')+'</div>'}
else if(id==='camera'){html=`<div style="height:58vh;max-height:390px;border-radius:25px;background:radial-gradient(circle at 55% 40%,#344357,#111820);display:grid;place-items:center;color:#dae2ed;font-size:14px">카메라 미리보기</div><div class="row" style="padding:18px"><span>⚡</span><button class="action" style="border-radius:50%;width:62px;height:62px;font-size:25px" onclick="toast('사진 촬영은 실제 카메라 앱에서 해주세요')">●</button><span>↻</span></div><p class="muted">이 시뮬레이터에서는 실제 카메라를 켜지 않아요.</p>`}
else if(id==='email'){html=`<button class="action" onclick="openEditor('emails')">＋ 메일 추가</button>`+(data.emails||[]).map(m=>`<div class="msg"><div class="row"><b>${esc(m.from)}</b><small class="muted">${esc(m.time)}</small></div><strong style="display:block;margin:5px 0">${esc(m.subject)}</strong><div class="muted">${esc(m.text)}</div></div>`).join('')||'<p class="muted">받은 메일이 없어요.</p>'}
else if(id==='browser'){html=`<div class="card" style="text-align:center;padding:25px"><div style="font-size:42px">🌐</div><h3>Chrome</h3><p class="muted">피터3의 브라우저</p><input class="searchbox" id="urlbox" placeholder="검색어 또는 웹 주소"><button class="action" onclick="fakeSearch('urlbox')">검색</button></div><div class="card"><b>즐겨찾기</b><p class="muted">자주 보는 페이지가 여기에 표시돼요.</p></div>`}
else if(id==='search'){html=`<div style="text-align:center;padding:22px 0"><div style="font-size:40px">🔍</div><h2>무엇이든 검색</h2></div><input class="searchbox" id="searchbox" placeholder="검색어를 입력하세요"><button class="action" onclick="fakeSearch('searchbox')">검색</button><div id="searchresult"></div>`}
else if(id==='phone'){html=`<div class="dial" id="dialnumber">번호 입력</div><div class="keys">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(x=>`<button onclick="dial('${x}')">${x}</button>`).join('')}</div><p style="text-align:center;margin:18px"><button class="call-btn" onclick="startCall()" aria-label="전화 걸기">📞</button></p><button class="action secondary" onclick="openEditor('contacts')">연락처 편집</button>`}
else if(id==='contacts'){html=`<button class="action" onclick="openEditor('contacts')">＋ 연락처 추가</button>`+(data.contacts||[]).map(c=>`<div class="card row"><div><b>${esc(c.name)}</b><div class="muted">${esc(c.number)}</div></div><a class="call-btn" href="tel:${esc(c.number)}" aria-label="${esc(c.name)}에게 전화">📞</a></div>`).join('')}
el.innerHTML=html}
function fakeSearch(id){let input=document.getElementById(id),q=input?.value||'';if(!q){toast('검색어를 입력해 주세요');return}let result=document.getElementById('searchresult');if(result)result.innerHTML=`<div class="card"><b>“${esc(q)}” 검색</b><p class="muted">데모 검색 화면이에요. 실제 인터넷 검색은 이 파일에서 실행하지 않아요.</p></div>`;else toast(`“${q}” 검색 데모`)}function dial(x){let n=document.getElementById('dialnumber');n.textContent=(n.textContent==='번호 입력'?'':n.textContent)+x}function startCall(){let n=document.getElementById('dialnumber').textContent.trim();if(!n||n==='번호 입력'){toast('전화번호를 먼저 입력해 주세요');return}if(confirm(n+' 번호로 전화 앱을 열까요?'))location.href='tel:'+encodeURIComponent(n)}function sendReply(){let input=document.getElementById('reply-input'),text=input?.value.trim();if(!text)return;data.replies??={};data.replies[window.activeThread]??=[];data.replies[window.activeThread].push({text,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})});save();showApp('messages')}
const labels={messages:'문자 메시지',notes:'메모',emails:'메일',events:'캘린더 일정',photos:'사진',alarms:'알람',contacts:'연락처',weather:'날씨'};
function openEditor(tab){document.getElementById('editor').classList.add('open');editorTab=tab||'messages';renderEditor()}function closeEditor(){document.getElementById('editor').classList.remove('open')}
function renderEditor(){let keys=['messages','notes','emails','events','photos','alarms','contacts','weather'];document.getElementById('tabs').innerHTML=keys.map(k=>`<button class="tab ${k===editorTab?'active':''}" onclick="editorTab='${k}';renderEditor()">${labels[k]}</button>`).join('');let c=document.getElementById('editorcontent');if(editorTab==='weather'){let w=data.weather||initial.weather;c.innerHTML=`<div class="formrow"><div class="field"><label>도시</label><input id="wcity" value="${esc(w.city)}"></div><div class="field"><label>기온</label><input id="wtemp" value="${esc(w.temp)}"></div></div><div class="formrow"><div class="field"><label>날씨 이모지</label><input id="wsky" value="${esc(w.sky)}"></div><div class="field"><label>설명</label><input id="wcond" value="${esc(w.condition||'맑음')}"></div></div><button class="action" onclick="data.weather={city:val('wcity'),temp:val('wtemp'),sky:val('wsky'),condition:val('wcond')};save()">날씨 저장</button>`;return}
let fields={messages:[['name','이름/보낸 사람'],['text','메시지 내용','textarea'],['time','시간']],notes:[['title','제목'],['text','내용','textarea'],['date','날짜']],emails:[['from','보낸 사람'],['subject','제목'],['text','메일 내용','textarea'],['time','시간']],events:[['title','일정 이름'],['date','날짜 (YYYY-MM-DD)','date'],['time','시간'],['place','장소']],photos:[['title','사진 이름'],['caption','사진 설명','textarea'],['emoji','사진 이모지']],alarms:[['time','알람 시간','time'],['label','알람 이름']],contacts:[['name','이름'],['number','전화번호']]}[editorTab]||[];let arr=data[editorTab]||[];c.innerHTML=`<div class="card"><div class="formrow">${fields.map(([id,l,t])=>`<div class="field"><label>${l}</label>${t==='textarea'?`<textarea id="new-${id}"></textarea>`:`<input id="new-${id}" ${t==='date'||t==='time'?`type="${t}"`:''} placeholder="${l}">`}</div>`).join('')}</div>${editorTab==='photos'?'<div class="field"><label>사진 파일 (선택)</label><input type="file" id="photo-file" accept="image/*"></div>':''}<button class="action" onclick="addItem()">＋ 추가</button></div><h3 style="font-size:15px">저장된 ${labels[editorTab]} (${arr.length})</h3><div>${arr.map((item,i)=>`<div class="itemedit"><header><strong>${esc(item.title||item.name||item.from||item.label||item.time||'항목')}</strong><button class="action danger" onclick="deleteItem(${i})">삭제</button></header><div class="hint">${esc(item.text||item.caption||item.place||item.number||item.subject||item.date||'')}</div></div>`).join('')||'<p class="hint">아직 추가된 내용이 없어요.</p>'}</div>`}
function val(id){return document.getElementById(id)?.value?.trim()||''}async function addItem(){let fields={messages:['name','text','time'],notes:['title','text','date'],emails:['from','subject','text','time'],events:['title','date','time','place'],photos:['title','caption','emoji'],alarms:['time','label'],contacts:['name','number']}[editorTab];if(editorTab==='weather')return;if(!fields)return;let item={};fields.forEach(k=>item[k]=val('new-'+k));if(editorTab==='messages'&&!item.time)item.time='방금';if(editorTab==='notes'&&!item.date)item.date='오늘';if(editorTab==='emails'&&!item.time)item.time='방금';if(fields.slice(0,2).every(k=>!item[k])){toast('내용을 입력해 주세요');return}if(editorTab==='photos'){let f=document.getElementById('photo-file')?.files?.[0];if(f){if(f.size>2*1024*1024){toast('사진은 2MB 이하로 골라주세요');return}item.image=await new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(f)})}}data[editorTab]??=[];data[editorTab].unshift(item);save();renderEditor()}
function deleteItem(i){data[editorTab].splice(i,1);save();renderEditor()}function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='peter3-galaxy-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data={...structuredClone(initial),...JSON.parse(r.result)};save();renderEditor();toast('백업을 불러왔어요')}catch{toast('백업 파일을 읽지 못했어요')}};r.readAsText(f)}function resetData(){if(confirm('추가한 내용을 모두 처음 상태로 되돌릴까요?')){data=structuredClone(initial);save();renderEditor()}}
let startY=null;document.getElementById('phone').addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});document.getElementById('phone').addEventListener('touchend',e=>{if(startY!==null&&startY-e.changedTouches[0].clientY>50)unlock();startY=null},{passive:true});renderHome();setInterval(renderHome,30000);
</script></body></html>
